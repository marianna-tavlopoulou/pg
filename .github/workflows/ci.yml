name: CI
on:
  push:
    branches: ['**']   # every branch, including main
  pull_request:
    branches: [main]   # also builds the merge result

# A new push cancels the older run on the same ref, except on main: every commit
# that lands on main must get its own build-and-test result, so a red commit is
# never hidden behind a later green one. PR runs use refs/pull/<n>/merge, so they
# are in a separate group and never cancel the branch's push runs (or vice versa).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job id is the required status check context on main: keep it stable.
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-key-for-ci-only-minimum-32-chars
      AUTH_API_KEY: local-dev-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: ./mvnw clean verify --no-transfer-progress
